# Checks that run before every commit (make hooks) and in the CI lint job
# (pre-commit run --all-files). Hook repos are pinned by commit, like the GitHub Actions.
# Needs: pre-commit and tofu on PATH; the other tools are installed by pre-commit itself.
exclude: ^gitops/platform/envoy-gateway/charts/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are not plain YAML.
        exclude: ^gitops/apps/templates/

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb # frozen: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        language: system
        entry: tofu fmt -recursive -check -diff infra/tofu
        files: \.(tf|tftest\.hcl)$
        pass_filenames: false

      - id: ansible-lint
        name: ansible-lint (production profile)
        language: python
        additional_dependencies: [ansible-core==2.21.4, ansible-lint==26.9.0]
        entry: scripts/ansible-lint.sh
        files: ^ansible/
        pass_filenames: false
