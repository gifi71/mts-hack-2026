# Angie demo app: plain-text "Hello World!", JSON access log to stdout,
# built-in Prometheus metrics on a separate port. Runs as non-root with a
# read-only root filesystem: everything writable lives in /tmp.
worker_processes 2;
pid /tmp/angie.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/angie/prometheus_all.conf;

    default_type text/plain;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"app":"demo","version":"$app_version",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"host":"$host",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout json;

    server {
        listen 8080;
        status_zone demo;

        # Sets $app_version; mounted from the per-version ConfigMap.
        include /etc/angie/version/version.conf;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Error paths for the log pipeline and the 4xx/5xx panels:
        # /missing opens a file that does not exist (404 + error log line), /error returns 500.
        location = /missing {
            root /nonexistent;
        }

        location = /error {
            return 500 "Internal error (angie $app_version)\n";
        }

        location / {
            add_header X-App-Version $app_version always;
            return 200 "Hello World! (angie $app_version)\n";
        }
    }

    server {
        listen 9113;
        access_log off;

        location = /metrics {
            prometheus all;
        }
    }
}
