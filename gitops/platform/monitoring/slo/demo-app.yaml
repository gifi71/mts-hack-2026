# SLOs of the demo app as code. Sloth turns this spec into multi-window, multi-burn-rate
# recording rules and alerts (Google SRE workbook): make slo writes
# ../manifests/slo-rules.yaml, CI checks that the generated file is up to date.
# Not applied to the cluster itself: there is no Sloth controller.
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: demo-app
  namespace: monitoring
spec:
  service: demo-app
  labels:
    owner: platform
  slos:
    - name: availability
      objective: 99.0
      description: Requests through Gateway edge to the demo app answered without 5xx, measured by Envoy.
      sli:
        events:
          # Measured at the gateway, not in Angie: Angie also counts kubelet probes (about 1 rps),
          # which would dilute real errors. The 5xx series appears only after the first 5xx.
          errorQuery: |
            sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/demo/.*", envoy_response_code_class="5"}[{{.window}}]))
            or vector(0)
          # No traffic in a window gives 0/0 = NaN, and one NaN sample spoils the 30-day
          # sum_over_time. With no requests the total falls back to 1, so the error ratio is 0.
          totalQuery: (sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/demo/.*"}[{{.window}}])) > 0) or vector(1)
      alerting:
        name: DemoAppAvailabilitySLO
        annotations:
          summary: The demo app burns its availability error budget too fast.
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning

    - name: latency
      objective: 99.0
      description: Requests through Gateway edge to the demo app served within 250 ms, measured by Envoy.
      sli:
        events:
          errorQuery: |
            sum(rate(envoy_cluster_upstream_rq_time_count{envoy_cluster_name=~"httproute/demo/.*"}[{{.window}}]))
            -
            sum(rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/demo/.*", le="250.0"}[{{.window}}]))
          # Same fallback as availability: the gateway sees no traffic between checks.
          totalQuery: (sum(rate(envoy_cluster_upstream_rq_time_count{envoy_cluster_name=~"httproute/demo/.*"}[{{.window}}])) > 0) or vector(1)
      alerting:
        name: DemoAppLatencySLO
        annotations:
          summary: Demo app requests slower than 250 ms burn the latency error budget too fast.
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
