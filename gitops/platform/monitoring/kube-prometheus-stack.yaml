# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# node-exporter, kube-state-metrics and kubeadm control plane scraping.

crds:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 3d # same as Loki
    retentionSize: 6GB
    scrapeInterval: 30s
    # Pick up ServiceMonitors, PodMonitors and rules from every namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 8Gi

alertmanager:
  alertmanagerSpec:
    retention: 72h
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

grafana:
  admin:
    # Created by Ansible with a random password (roles/platform_secrets).
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  testFramework:
    enabled: false
  grafana.ini:
    server:
      root_url: https://grafana.mts-hack.local:30443
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc:3100
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
