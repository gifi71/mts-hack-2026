apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - envoy.yaml
  - argocd.yaml
  - rules.yaml
  - slo-rules.yaml
  - calico.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: mts-hack-dashboards
    namespace: monitoring
    files:
      - dashboards/mts-hack-overview.json
  # Upstream dashboards from the pinned releases: Argo CD v3.5.3 examples/ unchanged,
  # Envoy Gateway v1.9.2 gateway-addons-helm with one hardcoded datasource uid in
  # envoy-gateway-global.json replaced with $datasource (see NOTICE).
  - name: argocd-dashboards
    namespace: monitoring
    files:
      - dashboards/argocd.json
  # Sloth dashboards from grafana.com (14348 rev 5, 14643 rev 2): the export input
  # DS_PROMETHEUS replaced with their own Datasource variable for sidecar provisioning,
  # __inputs and __requires removed.
  - name: slo-dashboards
    namespace: monitoring
    files:
      - dashboards/sloth-slo-detail.json
      - dashboards/sloth-slo-overview.json
  - name: envoy-gateway-dashboards
    namespace: monitoring
    files:
      - dashboards/envoy-gateway-global.json
      - dashboards/envoy-proxy-global.json
      - dashboards/envoy-clusters.json
