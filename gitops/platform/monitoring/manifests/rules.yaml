# Alerts for the demo app, the gateway and the log pipeline.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mts-hack
  namespace: monitoring
spec:
  groups:
    - name: demo-app
      rules:
        - record: demo:http_requests:rate5m
          expr: sum by (service) (rate(angie_http_server_zones_requests_total{zone="demo"}[5m]))
        # Gateway view: Angie's own counters include kubelet probes and would hide real 5xx.
        - record: demo:http_5xx_ratio:rate5m
          expr: |
            (sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/demo/.*", envoy_response_code_class="5"}[5m])) or vector(0))
            / clamp_min(sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/demo/.*"}[5m])), 1e-9)

        - alert: DemoAppDown
          expr: sum(up{namespace="demo", job=~"angie-v.*"}) == 0 or absent(up{namespace="demo", job=~"angie-v.*"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: No Angie pod of the demo app is scraped as up.
        - alert: DemoAppHighErrorRate
          expr: demo:http_5xx_ratio:rate5m > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of demo app responses are 5xx.

    - name: gateway
      rules:
        # Demo routes only: Argo CD and Grafana UIs keep long streaming requests open.
        - record: gateway:upstream_rq_time_p95_ms:rate5m
          expr: |
            histogram_quantile(0.95,
              sum by (le, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/demo/.*"}[5m])))

        - alert: GatewayProxyDown
          expr: sum(up{job=~".*envoy-proxy.*"}) == 0 or absent(up{job=~".*envoy-proxy.*"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: The Envoy proxy behind Gateway edge is not scraped as up.
        - alert: GatewayUpstreamSlow
          expr: gateway:upstream_rq_time_p95_ms:rate5m > 500
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "p95 upstream time for {{ $labels.envoy_cluster_name }} is above 500 ms."

    - name: logging
      rules:
        - alert: FluentdOutputErrors
          expr: sum(increase(fluentd_output_status_num_errors[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fluentd fails to deliver logs to Loki.
        - alert: FluentdBufferGrowing
          expr: sum(fluentd_output_status_buffer_queue_length) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fluentd buffer queue keeps growing, Loki may be slow or down.
