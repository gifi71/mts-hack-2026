crds:
  enabled: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: true

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 512Mi}

webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 256Mi}

cainjector:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 512Mi}
