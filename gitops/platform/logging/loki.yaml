# Loki in monolithic mode with filesystem storage: one pod, one PVC, no object storage.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h # same as Prometheus
    # Retention needs the compactor, not the delete API: keep logs from being deleted by any pod.
    deletion_mode: disabled
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}

backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}

# Optional components pull extra images (memcached, nginx) and memory.
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}

sidecar:
  image:
    registry: quay.io
