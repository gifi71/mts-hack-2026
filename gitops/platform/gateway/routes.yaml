# Platform UIs: HTTPS only, plain HTTP is redirected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: edge
      sectionName: http
  hostnames:
    - grafana.mts-hack.local
    - prometheus.mts-hack.local
    - argocd.mts-hack.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 30443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.mts-hack.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - prometheus.mts-hack.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.mts-hack.local
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
