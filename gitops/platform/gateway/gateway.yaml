apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    # Catch-all HTTP: `curl http://<node>:30080/` works without a Host header.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [demo, monitoring, argocd, envoy-gateway-system]
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.mts-hack.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: mts-hack-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [demo, monitoring, argocd, envoy-gateway-system]
