# Kyverno admission controller. The policies live in gitops/platform/kyverno/policies
# (separate Application, synced after Kyverno is Healthy).

global:
  image:
    # The same images as reg.kyverno.io. ghcr.io is already required for the Fluentd image,
    # so Kyverno adds no new registry.
    registry: ghcr.io

admissionController:
  replicas: 1
  serviceMonitor:
    enabled: true
  container:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 1Gi}

backgroundController:
  serviceMonitor:
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

reportsController:
  serviceMonitor:
    enabled: true
  # Reports grow with every pod in the cluster; the chart default (128Mi) is too tight.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}

# No cleanup policies here.
cleanupController:
  enabled: false

# Kyverno dashboard, picked up by the Grafana sidecar like the other dashboards.
grafana:
  enabled: true
  namespace: monitoring
