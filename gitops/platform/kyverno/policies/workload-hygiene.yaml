# Workload rules from AGENTS.md, checked for every pod in the cluster. Audit only: third-party
# charts are not ours to fix, results go to PolicyReports (kubectl get policyreport -A).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Audit]
  # The CRD default is Fail: an unavailable Kyverno would block every new pod for an audit-only rule.
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE, UPDATE]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          !c.image.endsWith(":latest") && (c.image.contains("@sha256:") || c.image.split("/")[c.image.split("/").size() - 1].contains(":")))
      message: Container images need a pinned tag or digest, not latest.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
spec:
  validationActions: [Audit]
  # The CRD default is Fail: an unavailable Kyverno would block every new pod for an audit-only rule.
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE, UPDATE]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          "cpu" in c.resources.requests && "memory" in c.resources.requests && "memory" in c.resources.limits)
      message: Containers need CPU and memory requests and a memory limit.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
spec:
  validationActions: [Audit]
  # The CRD default is Fail: an unavailable Kyverno would block every new pod for an audit-only rule.
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE, UPDATE]
  validations:
    - expression: object.spec.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))
      message: Containers need readiness and liveness probes.
