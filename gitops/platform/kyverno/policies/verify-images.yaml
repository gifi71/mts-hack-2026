# Images of this repository run only with the keyless cosign signature that the
# image-fluentd workflow makes on main: the build is signed in CI and checked at admission.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-own-images
spec:
  validationActions: [Deny]
  # On a single node a Kyverno or Sigstore outage must not block every new pod.
  # A signature that does not verify is still denied.
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 20
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE, UPDATE]
  matchImageReferences:
    - glob: ghcr.io/gifi71/mts-hack-2026/*
  validationConfigurations:
    # The manifests pin digests already; Kyverno must not rewrite pods Argo CD compares.
    mutateDigest: false
    verifyDigest: true
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - subject: https://github.com/gifi71/mts-hack-2026/.github/workflows/image-fluentd.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers
        .filter(image, image.startsWith("ghcr.io/gifi71/mts-hack-2026/"))
        .all(image, verifyImageSignatures(image, [attestors.ci]) > 0)
      message: Images of this repository must carry the cosign signature of its image-fluentd workflow on main.
