apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    # Vendored: the chart is published only as an OCI artifact on Docker Hub.
    path: gitops/platform/envoy-gateway/charts/gateway-crds-helm
    helm:
      valuesObject:
        crds:
          gatewayAPI:
            enabled: true
            channel: standard
          envoyGateway:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  {{- include "apps.syncPolicy" . | nindent 2 }}
