apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # The OSS Loki chart moved to grafana-community in 2026; grafana/helm-charts is Enterprise-only now.
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 18.13.7
      helm:
        releaseName: loki
        valueFiles:
          - $values/gitops/platform/logging/loki.yaml
    {{- include "apps.valuesSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  {{- include "apps.syncPolicy" . | nindent 2 }}
