version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /images/fluentd
    schedule:
      interval: weekly
    commit-message:
      prefix: build
