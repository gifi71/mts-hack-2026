name: security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rescan: new CVEs in an image that has not changed show up in the Security tab.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Every commit on main gets its own run: a cancelled run would turn the README badge red.
# Pull requests keep only the newest run.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets in git history (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac:
    name: IaC misconfigurations (Trivy config)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # All severities go to the Security tab; the gate below only fails on HIGH and CRITICAL.
      - name: Trivy config (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: gitops/platform/envoy-gateway/charts
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-config.sarif

      - name: Upload to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config gate (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: gitops/platform/envoy-gateway/charts
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  kubescape:
    name: Kubernetes posture (Kubescape NSA, MITRE)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      KUBESCAPE_VERSION: 4.0.15
      KUBESCAPE_SHA256: 011569dbcde85afc96cf63262e4f967166b6680fd70a623e9065334b6767b244
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kubescape
        run: |
          curl -fsSLo kubescape "https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE_VERSION}/kubescape_${KUBESCAPE_VERSION}_linux_amd64"
          echo "${KUBESCAPE_SHA256}  kubescape" | sha256sum -c -
          sudo install -m 0755 kubescape /usr/local/bin/kubescape

      # Our own manifests (app, Gateway API, monitoring), rendered by Kustomize.
      - name: Kubescape (SARIF)
        run: make kubescape KUBESCAPE_ARGS="--format sarif --output kubescape.sarif"

      - name: Upload to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: kubescape.sarif
          category: kubescape

      - name: Kubescape gate (HIGH, CRITICAL)
        run: make kubescape KUBESCAPE_ARGS="--severity-threshold high"

  image:
    name: deployed Fluentd image (cosign, Trivy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image the cluster runs: repository and tag@digest from the Fluentd values.
      - name: Image reference
        id: ref
        run: echo "image=$(yq '.image.repository + ":" + .image.tag' gitops/platform/logging/fluentd.yaml)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the signature
        run: |
          cosign verify "${{ steps.ref.outputs.image }}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image-fluentd.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Trivy image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          trivyignores: images/fluentd/.trivyignore.yaml
          format: sarif
          output: trivy-fluentd.sarif

      - name: Upload to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-fluentd.sarif
          category: trivy-fluentd

      # Pushes and pull requests fail on fixable HIGH and CRITICAL. The weekly run only
      # reports: a CVE published after the release goes to the Security tab, not the badge.
      - name: Trivy image gate (fixable HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          trivyignores: images/fluentd/.trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: ${{ github.event_name == 'schedule' && '0' || '1' }}
