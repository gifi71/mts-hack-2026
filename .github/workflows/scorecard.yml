name: scorecard

# OpenSSF Scorecard: supply-chain checks of the repository itself (pinned dependencies,
# token permissions, branch protection, signed releases and more). Results go to the
# Security tab and to the public badge in README. Publishing restricts this workflow to
# the approved actions and no env or defaults, see ossf/scorecard-action.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
