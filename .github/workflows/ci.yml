name: ci

# Documentation-only changes skip lint and the 13-minute e2e; the security
# workflow still runs on them (gitleaks covers docs too).
on:
  push:
    branches: [main]
    paths: &code
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - docs/passport/build.sh # shellcheck in lint
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Lock file matches requirements.in
        run: |
          make lock
          git diff --exit-code ansible/requirements.txt

      # Hash mode applies to the whole pip call, so the linters (unhashed) go in a second one.
      - name: Install Ansible and linters
        run: |
          pip install --require-hashes -r ansible/requirements.txt
          pip install ansible-lint==26.9.0 yamllint==1.38.0

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint (production profile)
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml -p .ansible/collections
          ansible-lint --profile production site.yml verify.yml info.yml

      - name: shellcheck
        run: shellcheck tests/smoke/*.sh scripts/*.sh docs/passport/build.sh

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: OpenTofu fmt, validate, test
        run: make tofu-check

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.22.0

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate Kubernetes manifests
        run: make manifests-check

  e2e:
    name: e2e on a clean Ubuntu 24.04 (kubeadm)
    # Runs alongside lint, not after it: lint takes under a minute, e2e about 13.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner ships Docker with Docker's containerd.io, which conflicts with
      # Ubuntu's containerd package used by the solution. man-db triggers make
      # every apt install take minutes on hosted runners.
      - name: Prepare the runner
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo systemctl stop docker.socket docker containerd || true
          sudo apt-get purge -y docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin containerd.io || true
          sudo iptables -P FORWARD ACCEPT

      - name: make deploy
        run: make deploy INVENTORY=ansible/inventory/localhost.yml ANSIBLE_ARGS="-e gitops_revision=${{ github.sha }}"

      - name: make deploy again (idempotency)
        run: |
          make deploy INVENTORY=ansible/inventory/localhost.yml ANSIBLE_ARGS="-e gitops_revision=${{ github.sha }}" | tee second-run.log
          grep -E "^k8s-node +: .* changed=0 .* failed=0" second-run.log

      - name: make verify
        run: make verify INVENTORY=ansible/inventory/localhost.yml

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=/etc/kubernetes/admin.conf
          sudo -E kubectl get nodes -o wide || true
          sudo -E kubectl get pods -A -o wide || true
          sudo -E kubectl -n argocd get applications -o wide || true
          sudo -E kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
