name: ci

# Documentation-only changes skip lint and the 13-minute e2e; the security
# workflow still runs on them (gitleaks covers docs too).
on:
  push:
    branches: [main]
    paths: &code
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - docs/passport/build.sh # shellcheck in lint
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Lock files match requirements.in
        run: |
          make lock
          git diff --exit-code ansible/requirements.txt .github/ci-requirements.txt

      - name: SLO rules match the Sloth spec
        env:
          SLOTH_VERSION: 0.16.0
          SLOTH_SHA256: 1cecaa50853abbb3669a928612b523df8174d258ea6f2a3c8f048e5fc5af90b2
        run: |
          curl -fsSLo sloth "https://github.com/slok/sloth/releases/download/v${SLOTH_VERSION}/sloth-linux-amd64"
          echo "${SLOTH_SHA256}  sloth" | sha256sum -c -
          sudo install -m 0755 sloth /usr/local/bin/sloth
          make slo
          git diff --exit-code gitops/platform/monitoring/manifests/slo-rules.yaml

      # Checks that the hashed lock installs, as make deps does on the controller.
      - name: Install Ansible from the lock
        run: pip install --require-hashes -r ansible/requirements.txt

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks developers run before each commit (make hooks): yamllint, shellcheck,
      # hadolint, actionlint, tofu fmt, ansible-lint and file hygiene. gitleaks runs in the
      # security workflow over the full history.
      - name: pre-commit (all files)
        env:
          SKIP: gitleaks
        run: |
          pip install --require-hashes -r .github/ci-requirements.txt
          pre-commit run --all-files --show-diff-on-failure

      - name: OpenTofu validate, test
        run: make tofu-check

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.22.0

      - name: Install kubeconform
        env:
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Render and validate Kubernetes manifests
        run: make manifests-check

  e2e:
    name: e2e on a clean Ubuntu 24.04 (kubeadm)
    # Runs alongside lint, not after it: lint takes under a minute, e2e about 13.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner ships Docker with Docker's containerd.io, which conflicts with
      # Ubuntu's containerd package used by the solution. man-db triggers make
      # every apt install take minutes on hosted runners.
      - name: Prepare the runner
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo systemctl stop docker.socket docker containerd || true
          sudo apt-get purge -y docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin containerd.io || true
          sudo iptables -P FORWARD ACCEPT

      - name: make deploy
        run: make deploy INVENTORY=ansible/inventory/localhost.yml ANSIBLE_ARGS="-e gitops_revision=${{ github.sha }}"

      - name: make deploy again (idempotency)
        run: |
          make deploy INVENTORY=ansible/inventory/localhost.yml ANSIBLE_ARGS="-e gitops_revision=${{ github.sha }}" | tee second-run.log
          grep -E "^k8s-node +: .* changed=0 .* failed=0" second-run.log

      - name: make verify
        run: make verify INVENTORY=ansible/inventory/localhost.yml

      - name: CIS Kubernetes Benchmark (kube-bench)
        run: |
          sudo tests/cis/kube-bench.sh
          { echo '### kube-bench (CIS)'; echo '```'; grep -E "^== Summary" -A4 kube-bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kube-bench report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kube-bench
          path: kube-bench.txt
          if-no-files-found: ignore

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=/etc/kubernetes/admin.conf
          sudo -E kubectl get nodes -o wide || true
          sudo -E kubectl get pods -A -o wide || true
          sudo -E kubectl -n argocd get applications -o wide || true
          sudo -E kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
