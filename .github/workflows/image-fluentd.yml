name: image-fluentd

on:
  push:
    branches: [main]
    paths:
      - images/fluentd/**
      - .github/workflows/image-fluentd.yml
  pull_request:
    paths:
      - images/fluentd/**
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/fluentd
  TAG: v1.19.3-loki1.3.0

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
      security-events: write # upload Trivy SARIF
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/fluentd
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # SBOM and SLSA provenance attached to the image as attestations.
          sbom: true
          provenance: mode=max

      - name: Check Loki plugin is installed
        run: docker run --rm --entrypoint fluent-gem "${IMAGE}:${TAG}" list fluent-plugin-grafana-loki | grep -q "1.3.0"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: sarif
          output: trivy-fluentd.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fluentd.sarif
          category: trivy-fluentd

      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign image (keyless, GitHub OIDC)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
