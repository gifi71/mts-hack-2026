name: image-fluentd

on:
  push:
    branches: [main]
    paths:
      - images/fluentd/**
      - .github/workflows/image-fluentd.yml
  pull_request:
    paths:
      - images/fluentd/**
      - .github/workflows/image-fluentd.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/fluentd
  # Fluentd and Loki plugin versions; the Debian snapshot date from the Dockerfile is appended.
  TAG_PREFIX: v1.19.3-loki1.3.0

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image tag
        id: tag
        run: |
          snapshot=$(sed -n 's/^ARG DEBIAN_SNAPSHOT=\([0-9]\{8\}\).*/\1/p' images/fluentd/Dockerfile)
          test -n "$snapshot"
          echo "tag=${TAG_PREFIX}-deb${snapshot}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build into the local Docker first: nothing reaches the registry before the
      # checks and the scan pass.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/fluentd
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Check the image
        env:
          REF: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
        run: |
          docker run --rm --entrypoint fluent-gem "$REF" list fluent-plugin-grafana-loki | grep -q "1.3.0"
          docker run --rm --entrypoint ruby "$REF" -e \
            'require "resolv"; puts "resolv #{Resolv::VERSION}"; exit(Gem::Version.new(Resolv::VERSION) >= Gem::Version.new("0.7.2"))'

      - name: Scan image with Trivy (fail on fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: images/fluentd/.trivyignore.yaml
          exit-code: "1"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the checked build, so the layers come from the builder cache.
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/fluentd
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # SBOM and SLSA provenance attached to the image as attestations.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - name: Sign image (keyless, GitHub OIDC)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
