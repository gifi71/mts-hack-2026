---
- name: Verify the platform
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Run smoke tests on the node
      ansible.builtin.script: ../tests/smoke/verify.sh
      register: verify_result
      changed_when: false
      failed_when: false

    - name: Show results
      ansible.builtin.debug:
        msg: "{{ verify_result.stdout_lines }}"

    # verify.sh prints checks to stdout; an aborted run explains itself on stderr.
    - name: Show errors
      ansible.builtin.debug:
        msg: "{{ verify_result.stderr_lines }}"
      when: verify_result.stderr_lines | default([]) | length > 0

    - name: Fail if any check failed
      ansible.builtin.assert:
        that: verify_result.rc == 0
        fail_msg: "verify.sh exited with {{ verify_result.rc }}: the number of FAIL checks, or an error shown above"
        quiet: true
