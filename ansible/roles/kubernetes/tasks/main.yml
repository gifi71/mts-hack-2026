---
- name: Add Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "{{ kubernetes_apt_url }}"
    suites: ["/"]
    signed_by: "{{ kubernetes_apt_url }}Release.key"
    state: present

- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name: "{{ kubernetes_packages | map('regex_replace', '$', '=' ~ kubernetes_version ~ '-' ~ kubernetes_package_revision) | list }}"
    state: present
    update_cache: true
    allow_change_held_packages: true

- name: Install crictl
  ansible.builtin.apt:
    name: "cri-tools={{ kubernetes_cri_tools_version }}"
    state: present
    allow_change_held_packages: true

- name: Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages + ['cri-tools'] }}"

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
