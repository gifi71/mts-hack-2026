---
- name: Create Helm version directory
  ansible.builtin.file:
    path: "{{ helm_install_dir }}/{{ helm_version }}"
    state: directory
    mode: "0755"

- name: Download Helm
  ansible.builtin.get_url:
    url: "{{ helm_download_url }}"
    dest: "{{ helm_install_dir }}/{{ helm_version }}/helm.tar.gz"
    checksum: "{{ helm_checksum }}"
    mode: "0644"
  # Downloads from GitHub and chart repos fail now and then (503); retry instead of
  # failing the whole run.
  register: helm_download
  retries: 3
  delay: 15
  until: helm_download is succeeded

- name: Unpack Helm
  ansible.builtin.unarchive:
    src: "{{ helm_install_dir }}/{{ helm_version }}/helm.tar.gz"
    dest: "{{ helm_install_dir }}/{{ helm_version }}"
    remote_src: true
    creates: "{{ helm_install_dir }}/{{ helm_version }}/linux-amd64/helm"

# force: replaces a Helm binary installed by other means (e.g. on CI runners),
# the node must use the pinned version.
- name: Link Helm binary
  ansible.builtin.file:
    src: "{{ helm_install_dir }}/{{ helm_version }}/linux-amd64/helm"
    dest: /usr/local/bin/helm
    state: link
    force: true
