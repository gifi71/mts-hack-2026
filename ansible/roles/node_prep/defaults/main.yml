---
node_prep_packages:
  - apt-transport-https
  - ca-certificates
  - conntrack
  - curl
  - gpg
  - jq
  - socat

node_prep_kernel_modules:
  - overlay
  - br_netfilter

node_prep_sysctl:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  # Defaults are too low for a node running Prometheus, Fluentd and Argo CD.
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288

# Checked before the first install only (re-runs on a working node are not blocked).
node_prep_min_memory_mb: 7000 # an "8 GB" VM reports about 7.7 GiB
node_prep_min_root_free_gb: 15
