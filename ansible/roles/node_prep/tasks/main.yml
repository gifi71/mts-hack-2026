---
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: node_prep_cloud_init_bin

# Freshly provisioned VMs run apt from cloud-init; wait so apt locks do not collide.
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: node_prep_cloud_init
  changed_when: false
  failed_when: node_prep_cloud_init.rc not in [0, 2] # 2 = finished with recoverable errors
  when: node_prep_cloud_init_bin.stat.exists

- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version("24.04", ">=")
    fail_msg: "Supported OS: Ubuntu 24.04, found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
    quiet: true

- name: Check whether the node is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: node_prep_admin_conf

- name: Check memory and free disk space
  ansible.builtin.assert:
    that:
      - ansible_facts.memtotal_mb >= node_prep_min_memory_mb
      - node_prep_root_free_gb | float >= node_prep_min_root_free_gb
    fail_msg: >-
      Need at least {{ node_prep_min_memory_mb }} MB RAM and {{ node_prep_min_root_free_gb }} GB free on /,
      found {{ ansible_facts.memtotal_mb }} MB and {{ node_prep_root_free_gb }} GB.
      Ubuntu installed from the ISO with LVM uses only part of the disk for /:
      sudo lvextend -r -l +100%FREE /dev/ubuntu-vg/ubuntu-lv
    quiet: true
  vars:
    node_prep_root_free_gb: >-
      {{ ((ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first).size_available / 1024**3) | round(1) }}
  when: not node_prep_admin_conf.stat.exists

- name: Install base packages
  ansible.builtin.apt:
    # Fresh cloud images run unattended-upgrades at boot and hold the dpkg lock.
    lock_timeout: 600
    name: "{{ node_prep_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Disable swap on boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ node_prep_kernel_modules }}"

- name: Set kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ node_prep_sysctl | dict2items }}"
