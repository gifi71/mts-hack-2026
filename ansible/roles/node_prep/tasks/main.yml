---
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: node_prep_cloud_init_bin

# Freshly provisioned VMs run apt from cloud-init; wait so apt locks do not collide.
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: node_prep_cloud_init
  changed_when: false
  failed_when: node_prep_cloud_init.rc not in [0, 2] # 2 = finished with recoverable errors
  when: node_prep_cloud_init_bin.stat.exists

- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version("24.04", ">=")
    fail_msg: "Supported OS: Ubuntu 24.04, found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
    quiet: true

- name: Check whether the node is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: node_prep_admin_conf

- name: Check memory and free disk space
  ansible.builtin.assert:
    that:
      - ansible_facts.memtotal_mb >= node_prep_min_memory_mb
      - node_prep_root_free_gb | float >= node_prep_min_root_free_gb
    fail_msg: >-
      Need at least {{ node_prep_min_memory_mb }} MB RAM and {{ node_prep_min_root_free_gb }} GB free on /,
      found {{ ansible_facts.memtotal_mb }} MB and {{ node_prep_root_free_gb }} GB.
      Ubuntu installed from the ISO with LVM uses only part of the disk for /:
      sudo lvextend -r -l +100%FREE /dev/ubuntu-vg/ubuntu-lv
    quiet: true
  vars:
    node_prep_root_free_gb: >-
      {{ ((ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first).size_available / 1024**3) | round(1) }}
  when: not node_prep_admin_conf.stat.exists

- name: Gather installed packages
  ansible.builtin.package_facts:
  when: not node_prep_admin_conf.stat.exists

# Docker's containerd.io conflicts with Ubuntu's containerd package used here, and apt
# would fail later with a less obvious error.
- name: Check that Docker is not installed
  ansible.builtin.assert:
    that: node_prep_conflicting | length == 0
    fail_msg: >-
      Found {{ node_prep_conflicting | join(', ') }}. The cluster uses Ubuntu's containerd,
      which conflicts with Docker's packages. Use a VM without Docker or remove them:
      sudo apt-get purge -y {{ node_prep_conflicting | join(' ') }}
    quiet: true
  vars:
    node_prep_conflicting: "{{ node_prep_conflicting_packages | select('in', ansible_facts.packages) | list }}"
  when: not node_prep_admin_conf.stat.exists

# Overlapping ranges bring the cluster up but break routing to the node's own network.
- name: Check that pod and service subnets do not overlap the node network
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress, sys
        node = ipaddress.ip_interface(sys.argv[1]).network
        overlap = [c for c in sys.argv[2:] if node.overlaps(ipaddress.ip_network(c))]
        if overlap:
            sys.exit(f"Node network {node} overlaps {', '.join(overlap)}. "
                     "Pick other ranges: -e k8s_pod_subnet=... -e k8s_service_subnet=...")
      - "{{ ansible_facts.default_ipv4.address }}/{{ ansible_facts.default_ipv4.prefix }}"
      - "{{ k8s_pod_subnet }}"
      - "{{ k8s_service_subnet }}"
  changed_when: false
  when: not node_prep_admin_conf.stat.exists

- name: Install base packages
  ansible.builtin.apt:
    # Fresh cloud images run unattended-upgrades at boot and hold the dpkg lock.
    lock_timeout: 600
    name: "{{ node_prep_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Disable swap on boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ node_prep_kernel_modules }}"

- name: Set kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ node_prep_sysctl | dict2items }}"
