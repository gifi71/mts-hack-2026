---
kubeadm_kubernetes_version: "{{ k8s_version }}"
kubeadm_cluster_name: "{{ k8s_cluster_name }}"
kubeadm_pod_subnet: "{{ k8s_pod_subnet }}"
kubeadm_service_subnet: "{{ k8s_service_subnet }}"
kubeadm_advertise_address: "{{ ansible_facts.default_ipv4.address }}"
# The machine hostname, not the inventory alias: any inventory (SSH or local)
# then refers to the same Kubernetes node. Lowercase: node names must be RFC 1123.
kubeadm_node_name: "{{ ansible_facts.hostname | lower }}"
kubeadm_cert_sans: []
kubeadm_config_path: /etc/kubernetes/kubeadm-config.yaml
kubeadm_admin_kubeconfig: /etc/kubernetes/admin.conf

# systemd-resolved keeps the real upstream servers here; /etc/resolv.conf points to the stub.
kubeadm_upstream_resolv_conf: /run/systemd/resolve/resolv.conf
kubeadm_kubelet_resolv_conf: /etc/kubernetes/resolv.conf

# Single node: no workers means workloads must run on the control plane.
kubeadm_untaint_control_plane: "{{ groups['workers'] | default([]) | length == 0 }}"
