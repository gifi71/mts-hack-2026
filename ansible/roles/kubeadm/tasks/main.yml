---
- name: Read upstream DNS servers
  ansible.builtin.slurp:
    src: "{{ kubeadm_upstream_resolv_conf }}"
  register: kubeadm_upstream_resolv

# Host search domains leak into every pod (ndots:5). A DHCP-provided domain with a
# wildcard record then resolves external names like github.com to the wrong host.
- name: Write resolv.conf for kubelet without search domains
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: "{{ kubeadm_kubelet_resolv_conf }}"
    mode: "0644"

- name: Write kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_config_path }}"
    mode: "0600"

- name: Initialize control plane
  ansible.builtin.command:
    cmd: kubeadm init --config {{ kubeadm_config_path }} --skip-token-print
    creates: "{{ kubeadm_admin_kubeconfig }}"
  register: kubeadm_init

# kubeadm writes this file only on init; keep existing nodes in line with the config.
- name: Point kubelet at the resolv.conf without search domains
  ansible.builtin.lineinfile:
    path: /var/lib/kubelet/config.yaml
    regexp: '^resolvConf:'
    line: "resolvConf: {{ kubeadm_kubelet_resolv_conf }}"
  notify: Restart kubelet

- name: Apply kubelet changes
  ansible.builtin.meta: flush_handlers

- name: Wait for API server
  ansible.builtin.command: kubectl --kubeconfig {{ kubeadm_admin_kubeconfig }} get --raw=/readyz
  register: kubeadm_readyz
  until: kubeadm_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Create kubeconfig directory for {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copy kubeconfig for {{ ansible_user }}
  ansible.builtin.copy:
    src: "{{ kubeadm_admin_kubeconfig }}"
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Read control plane taints
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubeadm_admin_kubeconfig }}
    get node {{ inventory_hostname }} -o jsonpath={.spec.taints[*].key}
  register: kubeadm_taints
  changed_when: false
  when: kubeadm_untaint_control_plane

# Covers clusters that were initialized before the taint was disabled in the config.
- name: Allow workloads on the control plane
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubeadm_admin_kubeconfig }}
    taint node {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule-
  when:
    - kubeadm_untaint_control_plane
    - "'node-role.kubernetes.io/control-plane' in kubeadm_taints.stdout"
  changed_when: true
