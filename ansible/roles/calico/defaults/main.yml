---
calico_version: v3.32.2
# GitHub release asset instead of the docs.tigera.io Helm repo: the latter is
# throttled from some networks (observed on the test stand: ~0.4 KB/s).
calico_release_url: "https://github.com/projectcalico/calico/releases/download/{{ calico_version }}"
calico_crds_chart_url: "{{ calico_release_url }}/crd.projectcalico.org.v1-{{ calico_version }}.tgz"
calico_chart_url: "{{ calico_release_url }}/tigera-operator-{{ calico_version }}.tgz"
calico_namespace: tigera-operator
calico_pod_cidr: "{{ k8s_pod_subnet }}"
calico_kubeconfig: /etc/kubernetes/admin.conf

# VXLAN without BGP: works on any L2/L3 network, including cloud VMs.
# Optional components are off to save memory on a single node.
calico_values:
  installation:
    enabled: true
    cni:
      type: Calico
    calicoNetwork:
      bgp: Disabled
      ipPools:
        - name: default-ipv4-ippool
          cidr: "{{ calico_pod_cidr }}"
          encapsulation: VXLAN
          natOutgoing: Enabled
          nodeSelector: all()
          blockSize: 26
  apiServer:
    enabled: false
  goldmane:
    enabled: false
  whisker:
    enabled: false
  defaultFelixConfiguration:
    enabled: true
    prometheusMetricsEnabled: true
