---
# Calico is installed by Ansible, not Argo CD: pods (Argo CD included) need a CNI first.
# Since v3.31 the CRDs ship as a separate chart and must exist before the operator chart.
- name: Install Calico CRDs
  kubernetes.core.helm:
    name: calico-crds
    chart_ref: "{{ calico_crds_chart_url }}"
    release_namespace: "{{ calico_namespace }}"
    create_namespace: true
    kubeconfig: "{{ calico_kubeconfig }}"
    binary_path: /usr/local/bin/helm

- name: Install Calico (tigera-operator)
  kubernetes.core.helm:
    name: calico
    chart_ref: "{{ calico_chart_url }}"
    release_namespace: "{{ calico_namespace }}"
    create_namespace: true
    release_values: "{{ calico_values }}"
    kubeconfig: "{{ calico_kubeconfig }}"
    binary_path: /usr/local/bin/helm
    wait: true
    wait_timeout: 10m

- name: Wait for node to become Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ calico_kubeconfig }}
    wait --for=condition=Ready node --all --timeout=600s
  changed_when: false

- name: Wait for CoreDNS
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ calico_kubeconfig }}
    -n kube-system rollout status deployment/coredns --timeout=300s
  changed_when: false
