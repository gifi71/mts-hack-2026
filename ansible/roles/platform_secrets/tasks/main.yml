---
- name: Check namespace {{ platform_secrets_grafana_namespace }}
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ platform_secrets_kubeconfig }}
    get namespace {{ platform_secrets_grafana_namespace }}
  register: platform_secrets_ns
  changed_when: false
  failed_when: false

- name: Create namespace {{ platform_secrets_grafana_namespace }}
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ platform_secrets_kubeconfig }}
    create namespace {{ platform_secrets_grafana_namespace }}
  when: platform_secrets_ns.rc != 0
  changed_when: true

- name: Check Grafana admin secret
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ platform_secrets_kubeconfig }}
    -n {{ platform_secrets_grafana_namespace }} get secret {{ platform_secrets_grafana_secret }}
  register: platform_secrets_grafana
  changed_when: false
  failed_when: false

# Generated only when missing, so re-runs keep the existing password.
- name: Create Grafana admin secret
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ platform_secrets_kubeconfig }}
    -n {{ platform_secrets_grafana_namespace }} create secret generic {{ platform_secrets_grafana_secret }}
    --from-literal=admin-user={{ platform_secrets_grafana_user }}
    --from-literal=admin-password={{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}
  when: platform_secrets_grafana.rc != 0
  changed_when: true
  no_log: true
